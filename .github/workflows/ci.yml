name: CI

# 只做三件事：查格式、查 lint、跑测试。这三条命令和本地完全一致
#（见根 README「提交前的自检」），所以本地过了就不会在 CI 上翻车。
on:
  push:
    branches: [main]
  pull_request:

# 只读就够了：本工作流不写回仓库、不发布任何东西。默认权限往往更宽，
# 显式收紧是低成本的好习惯。
permissions:
  contents: read

# 同一分支上连着推几次时，取消还没跑完的旧运行，只留最新那次。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 缓存 ~/.cargo 和 target/，第二次之后 CI 会快很多。
      - uses: Swatinem/rust-cache@v2

      - name: 检查代码格式
        run: cargo fmt --all --check

      # --locked 校验 Cargo.lock 与所有 Cargo.toml 一致，防止改了清单却忘了更新 lock。
      - name: Clippy 静态检查
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 运行测试
        run: cargo test --workspace --locked

  # 本地用最新 stable 永远证明不了「1.85 也能编译」，所以单开一个 job 用
  # 1.85 跑 check，保证新代码不会偷偷用上更新的 API。
  # MSRV 与 edition 的分工见 docs/01-cargo-and-toolchain.md。
  msrv:
    runs-on: ubuntu-latest
    # 关键的一行：仓库根目录有 rust-toolchain.toml（channel = "stable"），而
    # dtolnay/rust-toolchain 只执行 `rustup default`——rustup 的优先级里
    # toolchain 文件排在 default 前面，所以不设这个环境变量的话，这个 job 会
    # 拿最新 stable 又跑一遍 check，MSRV 根本没被验证。
    # 只有 RUSTUP_TOOLCHAIN 能压过 toolchain 文件，完整优先级见
    # docs/01-cargo-and-toolchain.md#rust-toolchaintoml-会压过-rustup-default。
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.85

      - uses: Swatinem/rust-cache@v2

      # 先把实际生效的版本打出来，这个 job 一旦又变成空转，日志里一眼能看见。
      - name: 确认工具链真的是 1.85
        run: |
          rustc --version
          rustc --version | grep -q ' 1\.85\.' || {
            echo "::error::期望 1.85，实际是 $(rustc --version)——MSRV job 又被 rust-toolchain.toml 劫持了"
            exit 1
          }

      - name: 在最低支持的 Rust 版本上检查
        run: cargo check --workspace --all-targets --locked
